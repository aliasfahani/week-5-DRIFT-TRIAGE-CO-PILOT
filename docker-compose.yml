services:
  model_api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: week5-model-api
    command: uvicorn services.model_api.app.main:app --host 0.0.0.0 --port 8000
    environment:
      AGENT_WEBHOOK_URL: http://agent_api:8001/webhooks/drift
    ports:
      - "8000:8000"
    volumes:
      - ./artifacts:/app/artifacts
      - ./runtime:/app/runtime
      - ./data:/app/data
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5

  agent_api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: week5-agent-api
    command: uvicorn services.agent_api.app.main:app --host 0.0.0.0 --port 8001
    environment:
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_DB: "0"
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: drift_triage
      POSTGRES_USER: drift_user
      POSTGRES_PASSWORD: drift_pass
    ports:
      - "8001:8001"
    volumes:
      - ./runtime:/app/runtime
      - ./prompts:/app/prompts
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: week5-dashboard
    command: streamlit run dashboard/app.py --server.address 0.0.0.0 --server.port 8501
    environment:
      MODEL_API_URL: http://model_api:8000
      AGENT_API_URL: http://agent_api:8001
    ports:
      - "8501:8501"
    depends_on:
      model_api:
        condition: service_healthy
      agent_api:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: week5-worker
    command: python -m services.worker.main
    environment:
      MODEL_API_URL: http://model_api:8000
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_DB: "0"
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: drift_triage
      POSTGRES_USER: drift_user
      POSTGRES_PASSWORD: drift_pass
      QUEUE_MAX_RETRIES: "3"
      QUEUE_RETRY_BASE_SECONDS: "2"
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    container_name: week5-postgres
    environment:
      POSTGRES_DB: drift_triage
      POSTGRES_USER: drift_user
      POSTGRES_PASSWORD: drift_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U drift_user -d drift_triage"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: week5-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
  redis_data:
